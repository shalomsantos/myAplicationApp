version: "3.6"
services:
  # NGINX:STABLE-ALPINE
  my_aplication_nginx:
    container_name: nginx
    image: nginx:stable-alpine
    ports:
      - "80:80"
    working_dir: /var/www/html
    volumes:
      - ./aplication:/var/www/html
      - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./conf/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - my_aplication_php
    networks:
      - app-network

  # PHP:8.1-FPM
  my_aplication_php:
    build: 
      args:
        user: user_application
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    container_name: php
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /var/www/html
    volumes:
       - ./aplication:/var/www/html
    depends_on:
      - my_aplication_mysql
      - my_aplication_redis
      - my_aplication_rabbitmq
    networks:
      - app-network

  # PHP:8.1-FPM Worker para RabbitMQ
  my_aplication_queue_worker:
    build: 
      context: ./
      dockerfile: ./conf/worker/Dockerfile
      args:
        user: user_application
        uid: 1000
    container_name: php_worker
    working_dir: /var/www/html
    volumes:
       - ./aplication:/var/www/html
    # Executa o comando do Laravel para escutar o RabbitMQ continuamente
    command: sh -c "composer require vladimir-yuldashev/laravel-queue-rabbitmq --no-interaction && php artisan config:clear && /usr/bin/supervisord -n -c /etc/supervisor/conf.d/laravel-worker.conf"
    depends_on:
      - my_aplication_php
      - my_aplication_rabbitmq
    networks:
      - app-network

  # NODE:20-ALPINE
  my_aplication_node: 
    container_name: node
    image: node:20-alpine
    ports:
      - "5173:5173"
    tty: true
    volumes:
      - ./aplication:/var/www/html
    working_dir: /var/www/html
    command: >
      sh -c "npm install &&
             npm run dev"
    depends_on:
      - my_aplication_nginx
    networks:
      - app-network

  # MYSQL:5.7
  my_aplication_mysql:
    container_name: mysql
    image: mysql:5.7.22
    ports:
      - '3306:3306'
    working_dir: /var/www/html
    volumes:
       - ./conf/mysql/data:/var/lib/mysql
    environment:
        MYSQL_DATABASE: basicus
        MYSQL_USER: user_aplicacao
        MYSQL_PASSWORD: shalom000
        MYSQL_ROOT_PASSWORD: shalom123
    networks:
      - app-network

  # REDIS:7-ALPINE
  my_aplication_redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # RABBITMQ:3-MANAGEMENT-ALPINE
  my_aplication_rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"    # Porta que o Laravel usa para enviar mensagens (AMQP)
      - "15672:15672"  # Interface Web para você gerenciar as filas
    environment:
      RABBITMQ_DEFAULT_USER: user_aplicacao
      RABBITMQ_DEFAULT_PASS: shalom000
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local